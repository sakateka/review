[package]
name = "review"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Review captured Git diffs locally with explicit persistent file marks"
license = "MIT"

[dependencies]
toml = "0.8"
anyhow = "=1.0.104"
crossterm = "=0.29.0"
ratatui = "=0.29.0"
riptags = { version = "=0.1.0", default-features = false, features = ["rust", "c", "cpp", "go", "zig", "python", "bash"] }
tree-sitter = "=0.27.1"
tree-sitter-json = "=0.24.8"
tree-sitter-yaml = "=0.7.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
similar = "=2.7.0"
signal-hook = "=0.3.18"
tempfile = "=3.27.0"
tree-sitter-highlight = "=0.27.0"
tree-sitter-rust = "=0.24.2"
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.0"
tree-sitter-bash = "=0.25.1"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-go = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-zig = "=1.1.2"
